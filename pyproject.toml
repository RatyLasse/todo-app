[project]
name = "todo-app"
version = "0.1.0"
description = "A persistent task list with optional AI priority and label suggestions"
readme = "README.md"
authors = [
    { name = "Lasse Räty", email = "lasse.raty@digitalworkforce.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1,<1",
    "pydantic>=2.12,<3",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.uv]
# Starlette 1.6's TestClient uses aliases deprecated by AnyIO 4.15.
# Remove this bound when Starlette supports the new imports without warnings.
constraint-dependencies = ["anyio<4.15"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
